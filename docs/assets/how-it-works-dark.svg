<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 496" width="880" height="496" role="img" aria-label="How pace-geojson works: a course document and an observation log go into fold, which returns every entrant's standing, time and the sentence why; folding up to any instant gives the live standings, and the end of the log gives the official result.">
  <title>How pace-geojson works</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .h { font-size: 15px; font-weight: 700; }
    .sub { font-size: 12px; fill: #9198a1; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; }
    .s { font-size: 11.5px; }
    .m { fill: #9198a1; }
    .b { font-weight: 700; }
    .chip { font-size: 11px; font-weight: 600; }
    .rule { font-size: 11.5px; }
    .why { font-size: 11.5px; font-style: italic; fill: #9198a1; }
    .note { font-size: 10.5px; fill: #ff7a2f; }
    .lbl { font-size: 11px; fill: #9198a1; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9198a1"/>
    </marker>
    <pattern id="checker" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#e6edf3"/><rect x="4" y="4" width="4" height="4" fill="#e6edf3"/>
    </pattern>
  </defs>

  <!-- the course document -->
  <rect x="16" y="16" width="300" height="196" rx="12" class="card"/>
  <text x="32" y="42" class="h">course document</text>
  <text x="300" y="42" class="sub" text-anchor="end">GeoJSON + rules</text>
  <path d="M40 108 C 90 108, 100 70, 160 70 S 236 102, 282 76" fill="none" stroke="#e6edf3" stroke-width="3" stroke-linecap="round"/>
  <circle cx="40" cy="108" r="5" fill="#e6edf3"/>
  <text x="40" y="128" class="lbl" text-anchor="middle">start</text>
  <rect x="154" y="64" width="12" height="12" transform="rotate(45 160 70)" fill="#ff7a2f"/>
  <text x="160" y="56" class="lbl" text-anchor="middle">km-5</text>
  <rect x="280" y="64" width="16" height="16" fill="url(#checker)" stroke="#e6edf3" stroke-width="1"/>
  <text x="288" y="98" class="lbl" text-anchor="middle">finish</text>
  <rect x="28" y="140" width="136" height="24" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/><text x="96" y="156" class="rule" text-anchor="middle">cut-off 07:40 @ km-5</text><rect x="172" y="140" width="136" height="24" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/><text x="240" y="156" class="rule" text-anchor="middle">punch km-5, or +2:00</text><rect x="28" y="172" width="136" height="24" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/><text x="96" y="188" class="rule" text-anchor="middle">no outside help</text><rect x="172" y="172" width="136" height="24" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/><text x="240" y="188" class="rule" text-anchor="middle">sub-50 @ finish</text>

  <!-- the observation log -->
  <rect x="16" y="232" width="300" height="180" rx="12" class="card"/>
  <text x="32" y="258" class="h">observation log</text>
  <text x="300" y="258" class="sub" text-anchor="end">append-only</text>
  <text x="32" y="283" class="mono s" xml:space="preserve"><tspan class="m">07:00:00</tspan>  ana started  start</text><text x="32" y="302" class="mono s" xml:space="preserve"><tspan class="m">07:22:00</tspan>  ana punched  km-5</text><text x="32" y="321" class="mono s" xml:space="preserve"><tspan class="m">07:26:00</tspan>  eve punched  km-5</text><text x="300" y="321" class="note" text-anchor="end">⚑ help</text><text x="32" y="340" class="mono s" xml:space="preserve"><tspan class="m">07:41:00</tspan>  ben punched  km-5</text><text x="32" y="359" class="mono s" xml:space="preserve"><tspan class="m">07:46:30</tspan>  ana finished finish</text><text x="32" y="378" class="mono s" xml:space="preserve"><tspan class="m">07:48:00</tspan>  dee finished finish</text><text x="300" y="378" class="note" text-anchor="end">↺ obs_11</text>
  <text x="32" y="402" class="lbl">… 15 rows, each: who · where · what · when</text>

  <!-- into the fold -->
  <path d="M316 114 C 336 114, 336 200, 354 204" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M316 322 C 336 322, 336 244, 354 238" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="150" class="lbl">plan</text>
  <rect x="356" y="172" width="132" height="96" rx="16" fill="#ff7a2f"/>
  <text x="422" y="220" text-anchor="middle" font-size="28" font-weight="800" fill="#0d1117" style="fill:#0d1117">fold</text>
  <text x="422" y="244" text-anchor="middle" font-size="11" style="fill:#0d1117">no clock · no IO</text>
  <text x="422" y="258" text-anchor="middle" font-size="11" style="fill:#0d1117">no randomness</text>
  <path d="M488 220 L 512 220" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- every entrant's result -->
  <rect x="516" y="16" width="348" height="396" rx="12" class="card"/>
  <text x="532" y="42" class="h">every entrant</text>
  <text x="848" y="42" class="sub" text-anchor="end">standing · time · why</text>
  
    <text x="536" y="82" class="mono b">ana</text>
    <rect x="578" y="68" width="100" height="20" rx="10" fill="none" stroke="#3fb950" stroke-width="1.5"/>
    <text x="628" y="82" class="chip" style="fill:#3fb950" text-anchor="middle">clean</text>
    <text x="692" y="82" class="mono">46:30</text><text x="848" y="82" class="chip" style="fill:#3fb950" text-anchor="end">sub-50</text><text x="536" y="104" class="why">Finishing inside 50:00 qualifies for sub-50.</text><line x1="532" y1="122" x2="848" y2="122" stroke="#30363d"/>
    <text x="536" y="148" class="mono b">ben</text>
    <rect x="578" y="134" width="100" height="20" rx="10" fill="none" stroke="#a371f7" stroke-width="1.5"/>
    <text x="628" y="148" class="chip" style="fill:#a371f7" text-anchor="middle">gated</text>
    <text x="692" y="148" class="mono">1:25:00</text><text x="536" y="170" class="why">The day ends for anyone reaching km-5 after 07:40.</text><line x1="532" y1="188" x2="848" y2="188" stroke="#30363d"/>
    <text x="536" y="214" class="mono b">cy</text>
    <rect x="578" y="200" width="100" height="20" rx="10" fill="none" stroke="#d29922" stroke-width="1.5"/>
    <text x="628" y="214" class="chip" style="fill:#d29922" text-anchor="middle">penalised</text>
    <text x="692" y="214" class="mono">54:00</text><text x="848" y="214" class="chip" style="fill:#d29922" text-anchor="end">+2:00</text><text x="536" y="236" class="why">Missing km-5 costs 2:00.</text><line x1="532" y1="254" x2="848" y2="254" stroke="#30363d"/>
    <text x="536" y="280" class="mono b">dee</text>
    <rect x="578" y="266" width="100" height="20" rx="10" fill="none" stroke="#3fb950" stroke-width="1.5"/>
    <text x="628" y="280" class="chip" style="fill:#3fb950" text-anchor="middle">clean</text>
    <text x="692" y="280" class="mono">48:00</text><text x="848" y="280" class="chip" style="fill:#3fb950" text-anchor="end">sub-50</text><text x="536" y="302" class="why">Finishing inside 50:00 qualifies for sub-50.</text><line x1="532" y1="320" x2="848" y2="320" stroke="#30363d"/>
    <text x="536" y="346" class="mono b">eve</text>
    <rect x="578" y="332" width="100" height="20" rx="10" fill="none" stroke="#f85149" stroke-width="1.5"/>
    <text x="628" y="346" class="chip" style="fill:#f85149" text-anchor="middle">disqualified</text>
    <text x="692" y="346" class="mono">55:00</text><text x="536" y="368" class="why">Taking outside assistance ends the day.</text>

  <!-- live and replay: the fold up to any instant -->
  <rect x="40" y="449" width="800" height="6" rx="3" fill="#262c36"/>
  <rect x="40" y="449" width="282.4" height="6" rx="3" fill="#ff7a2f"/>
  <line x1="416.5" y1="443" x2="416.5" y2="461" stroke="#a371f7" stroke-width="2"/>
  <text x="416.5" y="478" class="lbl" text-anchor="middle" style="fill:#a371f7">07:40 cut-off</text>
  <circle cx="322.4" cy="452" r="9" fill="#ff7a2f" stroke="#161b22" stroke-width="3"/>
  <text x="322.4" y="436" class="mono s" text-anchor="middle">fold_until(07:30) → live standings</text>
  <rect x="832.0" y="444" width="16" height="16" fill="url(#checker)" stroke="#e6edf3" stroke-width="1"/>
  <text x="856" y="436" class="mono s" text-anchor="end">end of log → the result</text>
  <text x="40" y="478" class="lbl" text-anchor="middle">07:00</text>
  <text x="322.4" y="478" class="lbl" text-anchor="middle">07:30</text>
  <text x="604.7" y="478" class="lbl" text-anchor="middle">08:00</text>
  <text x="840.0" y="478" class="lbl" text-anchor="middle">08:25</text>
</svg>
