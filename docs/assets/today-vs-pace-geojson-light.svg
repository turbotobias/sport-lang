<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 496" width="880" height="496" role="img" aria-label="Today: the rules are a PDF, re-typed by hand into a timing system, a watch, a tracker app and a broadcast, and the same runner gets four different answers. With pace-geojson: one file, read by the same four, gives one answer: who's in, who's out, and why.">
  <title>Today, and with pace-geojson</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 15px; font-weight: 700; }
    .sub { font-size: 12px; fill: #59636e; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12.5px; }
    .s { font-size: 12.5px; }
    .b { font-weight: 700; }
    .m { fill: #59636e; }
    .lbl { font-size: 11px; fill: #59636e; }
    .note { font-size: 11.5px; font-weight: 600; fill: #e8590c; }
    .ok { font-size: 11.5px; font-weight: 600; fill: #1a7f37; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .box { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .wire { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .green { fill: #1a7f37; } .red { fill: #cf222e; } .yellow { fill: #9a6700; } .purple { fill: #8250df; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#59636e"/>
    </marker>
    <pattern id="checker" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#1f2328"/><rect x="4" y="4" width="4" height="4" fill="#1f2328"/>
    </pattern>
  </defs>

  <!-- ═══ TODAY ═══ -->
  <text x="16" y="34" class="h">Today</text>
  <text x="864" y="34" class="sub" text-anchor="end">the rules are a PDF, re-typed by hand into every system</text>

  <!-- the PDF -->
  <rect x="16" y="48" width="150" height="174" rx="12" class="card"/>
  <path d="M60 64 H112 L128 80 V150 H60 Z" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M112 64 V80 H128" fill="none" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="70" y="92" width="44" height="3" rx="1.5" fill="#59636e"/>
  <rect x="70" y="102" width="48" height="3" rx="1.5" fill="#59636e"/>
  <rect x="70" y="112" width="36" height="3" rx="1.5" fill="#59636e"/>
  <rect x="70" y="122" width="46" height="3" rx="1.5" fill="#59636e"/>
  <rect x="70" y="132" width="30" height="3" rx="1.5" fill="#59636e"/>
  <text x="91" y="176" class="s b" text-anchor="middle">the rules, a PDF</text>
  <text x="91" y="194" class="sub" text-anchor="middle">cut-offs, checkpoints,</text>
  <text x="91" y="208" class="sub" text-anchor="middle">laps, penalties</text>

  <!-- re-typed, four times -->
  <path d="M168 135 C 210 135, 210 73, 250 73" class="wire" marker-end="url(#arrow)"/>
  <path d="M168 135 C 210 135, 210 117, 250 117" class="wire" marker-end="url(#arrow)"/>
  <path d="M168 135 C 210 135, 210 161, 250 161" class="wire" marker-end="url(#arrow)"/>
  <path d="M168 135 C 210 135, 210 205, 250 205" class="wire" marker-end="url(#arrow)"/>
  <text x="209" y="234" class="note" text-anchor="middle">re-typed, four times</text>

  <!-- the four systems -->
  <rect x="252" y="56" width="170" height="34" rx="8" class="box"/><text x="337" y="78" class="s b" text-anchor="middle">timing system</text>
  <rect x="252" y="100" width="170" height="34" rx="8" class="box"/><text x="337" y="122" class="s b" text-anchor="middle">watch</text>
  <rect x="252" y="144" width="170" height="34" rx="8" class="box"/><text x="337" y="166" class="s b" text-anchor="middle">tracker app</text>
  <rect x="252" y="188" width="170" height="34" rx="8" class="box"/><text x="337" y="210" class="s b" text-anchor="middle">broadcast</text>

  <!-- four answers -->
  <path d="M424 73 H448" class="wire" marker-end="url(#arrow)"/>
  <path d="M424 117 H448" class="wire" marker-end="url(#arrow)"/>
  <path d="M424 161 H448" class="wire" marker-end="url(#arrow)"/>
  <path d="M424 205 H448" class="wire" marker-end="url(#arrow)"/>
  <rect x="452" y="56" width="412" height="34" rx="8" fill="none" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="466" y="78" class="s"><tspan class="b">Anna</tspan> — <tspan class="green b">finished</tspan>, 4:58:10</text>
  <rect x="452" y="100" width="412" height="34" rx="8" fill="none" stroke="#cf222e" stroke-width="1.5"/>
  <text x="466" y="122" class="s"><tspan class="b">Anna</tspan> — <tspan class="red b">DNF</tspan>, missed a cut-off</text>
  <rect x="452" y="144" width="412" height="34" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="466" y="166" class="s m"><tspan class="b">Anna</tspan> — no rules loaded, just the line</text>
  <rect x="452" y="188" width="412" height="34" rx="8" fill="none" stroke="#9a6700" stroke-width="1.5"/>
  <text x="466" y="210" class="s"><tspan class="b">Anna</tspan> — <tspan class="yellow b">still running</tspan>, 3rd woman</text>
  <text x="452" y="240" class="note">four answers, no way to say which is right</text>

  <line x1="16" y1="258" x2="864" y2="258" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- ═══ WITH pace-geojson ═══ -->
  <text x="16" y="286" class="h">With pace-geojson</text>
  <text x="864" y="286" class="sub" text-anchor="end">the rules are one file, next to the course map; every system reads it</text>

  <!-- the file -->
  <rect x="16" y="300" width="150" height="174" rx="12" class="card"/>
  <path d="M36 358 C 60 358, 66 322, 96 322 S 132 350, 146 336" fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/>
  <circle cx="36" cy="358" r="4.5" fill="#1f2328"/>
  <rect x="91" y="317" width="10" height="10" transform="rotate(45 96 322)" fill="#e8590c"/>
  <rect x="140" y="330" width="13" height="13" fill="url(#checker)" stroke="#1f2328" stroke-width="1"/>
  <text x="91" y="392" class="mono" text-anchor="middle">"pace:rules": [ … ]</text>
  <text x="91" y="426" class="s b" text-anchor="middle">one file</text>
  <text x="91" y="444" class="sub" text-anchor="middle">the course, and its rules</text>
  <text x="91" y="458" class="sub" text-anchor="middle">as data</text>

  <!-- read, not re-typed -->
  <path d="M168 387 C 210 387, 210 329, 250 329" class="wire" marker-end="url(#arrow)"/>
  <path d="M168 387 C 210 387, 210 373, 250 373" class="wire" marker-end="url(#arrow)"/>
  <path d="M168 387 C 210 387, 210 417, 250 417" class="wire" marker-end="url(#arrow)"/>
  <path d="M168 387 C 210 387, 210 461, 250 461" class="wire" marker-end="url(#arrow)"/>
  <text x="209" y="488" class="ok" text-anchor="middle">read, never re-typed</text>

  <!-- the same four -->
  <rect x="252" y="312" width="170" height="34" rx="8" class="box"/><text x="337" y="334" class="s b" text-anchor="middle">timing system</text>
  <rect x="252" y="356" width="170" height="34" rx="8" class="box"/><text x="337" y="378" class="s b" text-anchor="middle">watch</text>
  <rect x="252" y="400" width="170" height="34" rx="8" class="box"/><text x="337" y="422" class="s b" text-anchor="middle">tracker app</text>
  <rect x="252" y="444" width="170" height="34" rx="8" class="box"/><text x="337" y="466" class="s b" text-anchor="middle">broadcast</text>

  <!-- one answer -->
  <path d="M424 329 H438 V461 H424" class="wire"/>
  <path d="M424 373 H438" class="wire"/>
  <path d="M424 417 H438" class="wire"/>
  <path d="M438 395 H448" class="wire" marker-end="url(#arrow)"/>
  <rect x="452" y="352" width="412" height="86" rx="8" fill="none" stroke="#1a7f37" stroke-width="2"/>
  <text x="466" y="378" class="s"><tspan class="b">Anna</tspan> — <tspan class="red b">missed the cut-off</tspan> at checkpoint 4, 13:02</text>
  <text x="466" y="400" class="mono m">rule: cutoffs[3] — "checkpoint 4 closes at 13:00"</text>
  <text x="466" y="424" class="s b">who's in · who's out · why</text>
  <text x="452" y="462" class="ok">one answer, the same on every screen, and the rule that says so</text>
</svg>
